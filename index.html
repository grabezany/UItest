<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #222222;
            color: #ffffff;
            padding-top: 60px;
            padding-bottom: 60px;
        }

        .topnavbar {
            width: 100%;
            height: 50px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #333333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 9999;
        }

        .topnavbar img {
            max-height: 30px;
            width: auto;
            object-fit: contain;
        }

        .topnavbar h3 {
            margin: 0;
            font-size: 1.1rem;
            text-align: center;
        }

        .navbar {
            background-color: #333;
            width: 100%;
            height: 50px;
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 9999;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .navbar img {
            max-width: 25%;
            max-height: 30px;
            width: auto;
            height: auto;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="topnavbar">
        <img src="https://grabezany.github.io/UItest/new_project.png" alt="Upload">
        <h3>WatermelonKatana</h3>
        <img src="https://grabezany.github.io/UItest/mail_icon.png" alt="Mail">
    </div>

    <div class="navbar">
        <img src="https://grabezany.github.io/UItest/home_icon.png" alt="First Image">
        <img src="https://grabezany.github.io/UItest/default_pfp.png" alt="Second Image">
        <img src="https://grabezany.github.io/UItest/search_icon.png" alt="Third Image">
        <img src="https://grabezany.github.io/UItest/chat_icon.png" alt="Fifth Image">
    </div>
</body>
</html>
