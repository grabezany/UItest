<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #222222;
            color: #ffffff;
            padding-top: 60px;
            padding-bottom: 60px;
            font-family: sans-serif;
            overscroll-behavior-y: contain;
            touch-action: pan-y; 
        }

        html body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            position: fixed;
        }

        .topnavbar {
            width: 100%;
            height: 50px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #333333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 9999;
        }

        .topnavbar img {
            max-height: 30px;
            width: auto;
            object-fit: contain;
        }

        .topnavbar h3 {
            margin: 0;
            font-size: 1.1rem;
            text-align: center;
        }

        .navbar {
            background-color: #333;
            width: 100%;
            height: 50px;
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 9999;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .navbar img {
            max-width: 25%;
            max-height: 30px;
            width: auto;
            height: auto;
            object-fit: contain;
            cursor: pointer;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: calc(100vh - 120px);
            text-align: center;
            padding: 20px;
        }

        #swipe-output {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #00e676;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="topnavbar">
        <img src="https://grabezany.github.io/UItest/new_project.png" alt="Upload">
        <h3>WatermelonKatana</h3>
        <img src="https://grabezany.github.io/UItest/mail_icon.png" alt="Mail">
    </div>

    <main class="content" id="swipe-zone">
        <h2 id="swipe-output">Swipe Test</h2>
    </main>

    <div class="navbar">
        <img src="https://grabezany.github.io/UItest/home_icon.png" alt="First Image">
        <img src="https://grabezany.github.io/UItest/default_pfp.png" alt="Second Image">
        <img src="https://grabezany.github.io/UItest/search_icon.png" alt="Third Image">
        <img src="https://grabezany.github.io/UItest/chat_icon.png" alt="Fifth Image">
    </div>

    <script>
        let currentPage = "home";
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;
        const minSwipeDistance = 50;
        const swipeZone = document.getElementById('swipe-zone');
        const output = document.getElementById('swipe-output'); 
        swipeZone.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, false);
        swipeZone.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            handleSwipe();
        }, false);

        function handleSwipe() {
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;
            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                if (Math.abs(deltaX) > minSwipeDistance) {
                    if (deltaX > 0) {
                        onSwipeRight();
                    } else {
                        onSwipeLeft();
                    }
                }
            } else {
                if (Math.abs(deltaY) > minSwipeDistance) {
                    if (deltaY > 0) {
                        onSwipeDown();
                    } else {
                        onSwipeUp();
                    }
                }
            }
        }

        function onSwipeLeft() {
            output.textContent = "Swiped Left";
            if (currentPage === "home") {
                currentPage = "profile";
                output.textContent = "Navigated to Profile Page";
            } else if (currentPage === "profile") {
                currentPage = "search";
                output.textContent = "Navigated to Search Page";
            } else if (currentPage === "search") {
                currentPage = "chat";
                output.textContent = "Navigated to Chat Page";
            }
        }

        function onSwipeRight() {
            output.textContent = "Swiped Right";
            if (currentPage === "chat") {
                currentPage = "search";
                output.textContent = "Navigated to Search Page";
            } else if (currentPage === "search") {
                currentPage = "profile";
                output.textContent = "Navigated to Profile Page";
            } else if (currentPage === "profile") {
                currentPage = "home";
                output.textContent = "Navigated to Home Page";
            }
        }

        function onSwipeUp() {
            output.textContent = "Swiped Up";
        }

        function onSwipeDown() {
            output.textContent = "Swiped Down";
        }
    </script>
</body>
</html>
