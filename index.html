<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .navbar {
            background-color: #333;
            width: 100vw;
            height: 50px;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 50px;
            box-sizing: border-box;
            z-index: 9999;
            display: flex;
            justify-content: space-around;
            align-items: center; 
        }

        .navbar img {
             max-width: 30%;
            max-height: 100%;
            width: auto;
             height: auto;
            object-fit: contain;
        }

        body {
            background-color: #222222;
        }
    </style>
</head>
<body>


    <div class="navbar">
        <img src="\home_icon.png" alt="First Image">
        <img src="\default_pfp.png" alt="Second Image">
        <img src="\search_icon.png" alt="Third Image">
        <img src="\mail_icon.png" alt="Fourth Image">
        <img src="\chat_icon.png" alt="Fifth Image">
    </div>
</body>
</html>
